name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  pure-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
